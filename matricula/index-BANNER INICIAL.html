<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=10, IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link href="css/bootstrap.css" rel="stylesheet" />
    <link href="css/bootstrap-theme.min.css" rel="stylesheet" />
    <link href="css/geral.css" rel="stylesheet" />
    <title>Matrícula 2026 - Guapó</title>
	
    <style>
        body {
            background-color: #edece8; /* creme */
            margin: 0;
            padding: 0;
        }

        /* Centraliza e limita a largura do conteúdo */
        .responsivo {
            max-width: 905px;
            margin: 0 auto; /* ISSO centraliza o bloco */
            text-align: center; /* ajuda a centralizar imagem e botão */
            padding: 0px 0;
        }

        /* Ajuste da imagem */
        .responsivo img {
            width: 100%;
            height: auto;
            display: block;
            margin: 15px auto;
        }

        /* Centraliza o botão */
        .btn-ajuste {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="responsivo">
        <img src="img/matricula2026-guapo-2.png" alt="Guapó" />
    </div>

    <div class="responsivo">
        <div class="btn-ajuste">
            <input type="button" class="btn btn-lg btn-success" 
                   name="btnInscricao" id="btnSalvar" 
                   value="Atualizar" 
                   onClick="window.location='index.html'" />
        </div>
    </div>

</body>
</html>
